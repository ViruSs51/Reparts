{% extends "main/main.html" %}
{% load static %}

{% block title %}Log-in{% endblock %}

{% block header %}
    {% include 'main/header.html' with search=True %}
{% endblock %}
{% block content %}
    <div class="content__container container">
        <div class="content__auth-form auth-form login">
            <form action="{% url "login" %}" method="post" class="auth-form__container container">
                {% csrf_token %}
                <div class="auth-form__column column auth-form__column_title">
                    <h2 class="auth-form__row row auth-form__row_title">Вход</h2>
                </div>
                <div class="auth-form__column column auth-form__column_inputs">
                    <div class="auth-form__row row">
                        {{ form.username }}
                    </div>
                    <div class="auth-form__row row">
                        {{ form.password }}
                    </div>
                </div>
                <div class="auth-form__column column auth-form__column_button column_button">
                    <div class="auth-form__row row">
                        <button type="submit">
                            Войти
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
