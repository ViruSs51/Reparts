{% extends "main/main.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block header %}
    {% include 'main/header.html' with search=True %}
{% endblock %}
{% block content %}
    <div class="content__container container">
        <div class="content__login login">
            <form action="#" method="post" class="login__container container">
                {% csrf_token %}
                <div class="login__column column login__column_title">
                    <h2 class="login__row row login__row_title">Вход</h2>
                </div>
                <div class="login__column column login__column_inputs">
                    <div class="login__row row">
                        <input type="email" name="email" placeholder="Электронная почта" aria-label="Электронная почта">
                    </div>
                    <div class="login__row row">
                        <input type="password" name="password" placeholder="Пароль" aria-label="Пароль">
                    </div>
                </div>
                <div class="login__column column login__column_button">
                    <div class="login__row row">
                        <button method="submit">
                            Войти
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
