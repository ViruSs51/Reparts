{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="{% static "main/css/reset.css" %}">

    <link rel="stylesheet" href="{% static "main/css/main.css" %}">

    {% block head %}{% endblock %}
</head>
<body>
    <div class="wrapper">
        <div class="container">
            {% include "main/menu.html" %}
            {% include "main/second-hotbar.html" %}
            <header class="container__header header">
                {% block header %}{% endblock %}
            </header>
            <div class="container__content content">
                {% block content %}{% endblock %}
            </div>
            <footer class="container__footer footer">
                {% include 'main/footer.html' %}
            </footer>
        </div>
    </div>

    <script src="{% static "main/js/second-hotbar.js" %}"></script>
    <script src="{% static "main/js/menu.js" %}"></script>
    <script src="{% static "main/js/scroll-categories.js" %}"></script>
</body>
</html>
